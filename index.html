  <title>Estimate List - Sandeep ElectroFix</title>  <link rel="stylesheet" href="style.css">
</head><body><div id="app">  <!-- =====================================================

<button
  id="menuBtn"
  class="iconBtn"

  aria-label="Open menu"
  aria-expanded="false"
>
  <span></span>
</button>


<!-- Center Branding -->

<div class="brandHead">

  <img
    class="topLogo"
    src="logo.png"

  >

  <h1 class="appTitle">
    Estimate List

  <div class="subTitle">

  </div>

</div>


<!-- Theme Switch -->

<button
  id="themeBtn"
  class="themeBtn"
  type="button"
  aria-label="Toggle theme"
  aria-pressed="false"
>
  <span class="themeIcon">☀️</span>
</button>

<button
  id="langBtn"
  class="langBtn"
  type="button"
  aria-label="Change language"
>
  हि
</button>

    id="drawer"
    class="drawer"

</button>


<div class="drawerBrand">

</div>

</button>

    class="drawerOverlay"
