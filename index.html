<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#050816">
  <title>Estimate List - Sandeep ElectroFix</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <section id="splash" class="splash">
      <div class="logoMark">SE</div>
      <h1>Estimate List</h1>
      <p>Sandeep ElectroFix</p>
    </section>

    <header class="topbar">
      <button id="menuBtn" class="iconBtn">☰</button>
      <div>
        <div class="appTitle">Estimate List</div>
        <div class="subTitle">Sandeep ElectroFix</div>
      </div>
      <button id="langBtn" class="langBtn">हिं</button>
    </header>

    <aside id="drawer" class="drawer">
      <button id="closeMenu" class="drawerClose">×</button>
      <h2>Menu</h2>
      <button data-page="home">⌂ Home</button>
      <button data-page="estimate">▤ Estimate</button>
      <button data-page="calculator">⌁ Calculator</button>
      <button data-page="settings">⚙ Settings</button>
    </aside>

    <main id="main"></main>

    <nav class="bottomNav">
      <button data-page="home">⌂<span>Home</span></button>
      <button data-page="estimate">▤<span>Estimate</span></button>
      <button data-page="calculator">⌁<span>Calc</span></button>
      <button data-page="settings">⚙<span>Settings</span></button>
    </nav>
  </div>

  <script src="config.js"></script>
  <script src="material.js"></script>
  <script src="app.js"></script>
</body>
</html>
