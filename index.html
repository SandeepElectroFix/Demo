<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Estimate List - Sandeep ElectroFix</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =====================================================
       HEADER
  ====================================================== -->
  <header class="topbar">

    <div class="brand">
      <div class="brand-logo">⚡</div>

      <div>
        <div class="brand-title">Estimate List</div>
        <div class="brand-subtitle">SANDEEP ELECTROFIX</div>
      </div>
    </div>

    <button
      class="estimate-count-btn action-btn"
      id="headerEstimateBtn"
      type="button"
    >
      <span>Estimate</span>
      <b id="headerCount">0</b>
    </button>

  </header>


  <!-- =====================================================
       MAIN
  ====================================================== -->
  <main class="app">

    <!-- STAGE HERO -->
    <section class="stage-hero">

      <div class="stage-number">
        STAGE 01
      </div>

      <h1>Slab Conduit Installation</h1>

      <p>
        Select material and create your electrical estimate quickly.
      </p>

      <button
        class="stage-open-btn action-btn"
        id="stageOpenBtn"
        type="button"
      >
        <span>Open Stage</span>
        <span class="arrow">↓</span>
      </button>

    </section>


    <!-- STAGE CONTENT -->
    <section id="stageContent" class="stage-content">

      <!-- TOOLBAR -->
      <div class="toolbar">

        <div class="toolbar-left">
          <span class="material-count">
            <b id="materialCount">10</b> Materials
          </span>
        </div>

        <div class="view-switch">

          <button
            class="view-btn action-btn active"
            data-view="grid"
            type="button"
            title="Grid View"
          >
            ▦
          </button>

          <button
            class="view-btn action-btn"
            data-view="list"
            type="button"
            title="List View"
          >
            ☷
          </button>

          <button
            class="view-btn action-btn"
            data-view="compact"
            type="button"
            title="Compact View"
          >
            ▤
          </button>

        </div>

      </div>


      <!-- MATERIALS -->
      <div
        id="materialsGrid"
        class="materials-grid"
      ></div>

    </section>

  </main>


  <!-- =====================================================
       MATERIAL MODAL
  ====================================================== -->
  <div
    id="materialModal"
    class="modal"
    aria-hidden="true"
  >

    <div class="modal-backdrop" id="modalBackdrop"></div>

    <div class="material-sheet">

      <!-- MODAL HEADER -->
      <div class="sheet-header">

        <button
          id="modalBackBtn"
          class="close-btn action-btn"
          type="button"
          aria-label="Back"
        >
          ←
        </button>

        <div class="sheet-title-area">

          <div class="sheet-stage">
            STAGE 01
          </div>

          <h2 id="modalTitle">
            Material
          </h2>

        </div>

        <button
          id="modalCloseBtn"
          class="close-btn action-btn"
          type="button"
          aria-label="Close"
        >
          ×
        </button>

      </div>


      <!-- MATERIAL IMAGE -->
      <div
        id="modalMaterialVisual"
        class="modal-material-visual"
      ></div>


      <!-- FORM -->
      <div
        id="materialForm"
        class="material-form"
      ></div>


      <!-- ACTIONS -->
      <div class="sheet-actions">

        <button
          id="nextBtn"
          class="secondary-btn action-btn"
          type="button"
        >
          <span>Next</span>
          <span>→</span>
        </button>

        <button
          id="addBtn"
          class="primary-btn action-btn"
          type="button"
        >
          <span>＋ Add to Estimate</span>
        </button>

      </div>

    </div>

  </div>


  <!-- =====================================================
       ESTIMATE DRAWER
  ====================================================== -->
  <div
    id="estimateDrawer"
    class="drawer"
    aria-hidden="true"
  >

    <div
      id="drawerBackdrop"
      class="drawer-backdrop"
    ></div>

    <aside class="drawer-panel">

      <div class="drawer-header">

        <div>
          <div class="drawer-kicker">CURRENT PROJECT</div>
          <h2>Estimate</h2>
        </div>

        <button
          id="drawerCloseBtn"
          class="close-btn action-btn"
          type="button"
        >
          ×
        </button>

      </div>


      <div
        id="estimateList"
        class="estimate-list"
      ></div>


      <div class="drawer-footer">

        <div class="estimate-total-row">
          <span>Total Items</span>
          <strong id="drawerCount">0</strong>
        </div>

        <button
          id="clearEstimateBtn"
          class="danger-btn action-btn"
          type="button"
        >
          Clear Estimate
        </button>

      </div>

    </aside>

  </div>


  <!-- =====================================================
       FIXED BOTTOM BAR
  ====================================================== -->
  <div class="bottom-bar">

    <div class="bottom-info">

      <span class="bottom-icon">⚡</span>

      <div>
        <small>ESTIMATE</small>
        <strong>
          <span id="bottomCount">0</span> Items
        </strong>
      </div>

    </div>

    <button
      id="bottomEstimateBtn"
      class="bottom-view-btn action-btn"
      type="button"
    >
      View Estimate
      <span>→</span>
    </button>

  </div>


  <!-- =====================================================
       TOAST
  ====================================================== -->
  <div
    id="toast"
    class="toast"
    role="status"
    aria-live="polite"
  ></div>


  <!-- JS -->
  <script src="script.js"></script>

</body>
</html>
